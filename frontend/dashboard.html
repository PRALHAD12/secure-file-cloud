<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="config.js"></script><title>Dashboard · Secure File Cloud</title></head>
<body><div id="sidebar"></div><main class="content"><header id="topbar"></header><div class="page">
<div class="d-flex justify-content-between align-items-center mb-3"><div class="text-secondary small">All values are read from your cloud storage and the activity log.</div><button class="btn btn-outline-primary btn-sm" id="refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button></div>
<div class="row g-3 mb-3" id="cards"></div>
<div class="row g-3"><div class="col-xl-8"><div class="panel mb-3"><h2>Recent file activity</h2><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>File</th><th>Size</th><th>Status</th></tr></thead><tbody id="activity"></tbody></table></div></div>
<div class="panel"><h2>Stored files</h2><div class="table-wrap"><table class="table"><thead><tr><th>File</th><th>Original</th><th>Segments</th><th>Stored (encrypted)</th><th>Uploaded</th></tr></thead><tbody id="files"></tbody></table></div></div></div>
<div class="col-xl-4"><div class="panel" id="cloud"></div></div></div>
</div></main>
<script type="module" src="js/dashboard.js"></script></body></html>
